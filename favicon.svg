<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient cyan → red -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6db5c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3232c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond arrondi avec gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Cercle blanc semi-transparent -->
  <circle cx="32" cy="32" r="20" fill="rgba(255,255,255,0.25)"/>

  <!-- Triangle play blanc -->
  <path d="M 26 22 L 26 42 L 42 32 Z" fill="white"/>
</svg>
