<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #6DB5C4;
      --navy: #2D3853;
      --red: #E3232C;
      --white: #ffffff;
      --gray: #898F9F;
    }

    body {
      font-family: 'Europa', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--white);
      color: var(--navy);
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header flou et assombri quand vidéo ouverte */
    body.video-playing header {
      background: rgba(240, 240, 240, 0.6);
      backdrop-filter: blur(40px) brightness(0.95);
      border-bottom-color: rgba(0, 0, 0, 0.02);
    }

    body.video-playing header .logo,
    body.video-playing header nav a {
      opacity: 0.4;
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo FREAKS */
    .logo-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -3.5px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
    }

    .logo span {
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo span:hover {
      transform: translateY(-12px) rotate(-5deg) scale(1.15);
    }

    /* 10 animations différentes pour les lettres du logo */
    @keyframes logoAnim1 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-18px) rotate(-10deg) scale(1.15); }
    }

    @keyframes logoAnim2 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(15deg); }
    }

    @keyframes logoAnim3 {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.2); }
      60% { transform: translateY(-8px) scale(0.95); }
    }

    @keyframes logoAnim4 {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-15px) rotateX(360deg); }
    }

    @keyframes logoAnim5 {
      0%, 100% { transform: translateY(0) skewY(0deg); }
      50% { transform: translateY(-14px) skewY(10deg); }
    }

    @keyframes logoAnim6 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-10px) rotate(-5deg) scale(1.1); }
      75% { transform: translateY(-16px) rotate(8deg) scale(1.05); }
    }

    @keyframes logoAnim7 {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-12px) rotateY(180deg); }
    }

    @keyframes logoAnim8 {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-22px) scale(0.9) rotate(20deg); }
    }

    @keyframes logoAnim9 {
      0%, 100% { transform: translateY(0); }
      20% { transform: translateY(-25px); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-18px); }
      80% { transform: translateY(-6px); }
    }

    @keyframes logoAnim10 {
      0%, 100% { transform: translateY(0) rotate(0deg) skewX(0deg); }
      50% { transform: translateY(-16px) rotate(-12deg) skewX(-5deg); }
    }

    .logo span.animate-1 { animation: logoAnim1 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-2 { animation: logoAnim2 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-3 { animation: logoAnim3 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-4 { animation: logoAnim4 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-5 { animation: logoAnim5 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-6 { animation: logoAnim6 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-7 { animation: logoAnim7 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-8 { animation: logoAnim8 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-9 { animation: logoAnim9 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-10 { animation: logoAnim10 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .logo .f { color: var(--cyan); }
    .logo .r { color: var(--navy); }
    .logo .e { color: var(--red); }
    .logo .a { color: var(--navy); }
    .logo .k { color: var(--cyan); }
    .logo .s { color: var(--red); }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gray);
      font-weight: 300;
      margin-bottom: 14px;
    }

    /* Navigation ULTRA PREMIUM - Minimaliste luxe */
    nav {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    nav a {
      color: var(--gray);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 8px 0;
      background: transparent;
    }

    /* Ligne subtile sous le bouton actif */
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    nav a:hover {
      color: var(--navy);
    }

    nav a:hover::after {
      transform: scaleX(1);
    }

    nav a.active {
      color: var(--navy);
      font-weight: 500;
    }

    nav a.active::after {
      transform: scaleX(1);
    }

    nav a.active[data-page="film"] {
      color: var(--cyan);
    }

    nav a.active[data-page="music"] {
      color: var(--red);
    }

    nav a.active[data-page="contact"] {
      color: var(--navy);
    }

    /* Sections */
    .page-section {
      display: none;
      min-height: 100vh;
      padding: 140px 60px 100px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-section.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Grid vidéos avec couleurs */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    .video-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.95);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    /* Clone en position fixed - propriétés identiques à l'original */
    /* Styles communs pour tous les clones (film + music) */
    .video-clone {
      overflow: hidden;
      box-sizing: border-box;
      border: 2px solid transparent;
      border-radius: 20px;
      z-index: 9999;
      background: #000; /* Masque le gap pendant transition miniature → iframe */
    }

    /* Thumbnail du clone doit être derrière l'iframe */
    .video-clone .video-thumbnail,
    .video-clone .music-thumbnail {
      z-index: -1 !important;
    }

    .video-card.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 10 effets hover différents - assignés aléatoirement */
    /* Désactive hover si vidéo en lecture */
    .video-card.playing:hover {
      transform: none !important;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 40px 100px rgba(0, 0, 0, 0.25),
        0 20px 40px rgba(0, 0, 0, 0.15) !important;
    }

    .video-card.hover-1:hover:not(.playing) {
      transform: translateY(-12px) scale(1.03) rotate(1deg);
      box-shadow: 0 25px 70px rgba(109, 181, 196, 0.3);
      z-index: 10;
    }

    .video-card.hover-2:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotate(-2deg);
      box-shadow: 0 20px 60px rgba(227, 35, 44, 0.25);
      z-index: 10;
    }

    .video-card.hover-3:hover:not(.playing) {
      transform: translateY(-10px) scale(1.04) skewY(1deg);
      box-shadow: 0 22px 65px rgba(45, 56, 83, 0.3);
      z-index: 10;
    }

    .video-card.hover-4:hover:not(.playing) {
      transform: translateY(-15px) scale(1.02) rotateX(3deg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    .video-card.hover-5:hover:not(.playing) {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 20px 70px rgba(109, 181, 196, 0.35);
      z-index: 10;
    }

    .video-card.hover-6:hover:not(.playing) {
      transform: translateY(-12px) scale(1.04) rotate(2deg) perspective(500px);
      box-shadow: 0 25px 75px rgba(227, 35, 44, 0.3);
      z-index: 10;
    }

    .video-card.hover-7:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotateY(2deg);
      box-shadow: 0 18px 60px rgba(45, 56, 83, 0.28);
      z-index: 10;
    }

    .video-card.hover-8:hover:not(.playing) {
      transform: translateY(-14px) scale(1.03) skewX(-1deg);
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.22);
      z-index: 10;
    }

    .video-card.hover-9:hover:not(.playing) {
      transform: translateY(-10px) scale(1.05) rotate(-1deg);
      box-shadow: 0 22px 68px rgba(109, 181, 196, 0.32);
      z-index: 10;
    }

    .video-card.hover-10:hover:not(.playing) {
      transform: translateY(-16px) scale(1.02) perspective(800px) rotateX(-2deg);
      box-shadow: 0 30px 85px rgba(227, 35, 44, 0.28);
      z-index: 10;
    }

    .video-card:hover:not(.playing) .video-thumbnail {
      transform: scale(1.05);
    }

    /* Désactive tous les effets internes quand vidéo en lecture */
    .video-card.playing:hover .video-thumbnail {
      transform: none;
    }

    .video-card.playing:hover::before {
      opacity: 0 !important;
    }

    .video-card.playing:hover .play-btn,
    .video-card.playing:hover .video-info {
      opacity: 0 !important;
    }

    /* Video card expanded - mode cinéma CLEAN & ÉLÉGANT */
    .video-card.playing {
      position: fixed !important;
      z-index: 10000;
      cursor: default;
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 40px 100px rgba(0, 0, 0, 0.25),
        0 20px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Animation ultra fluide GPU-accelerated */
    .video-card {
      will-change: transform;
      transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Anti-scintillement sur les éléments internes */
    .video-card .play-btn,
    .video-card .video-info,
    .video-card::before {
      transition: all 0.5s ease;
    }

    /* Garde la miniature visible pendant chargement (sauf clone) */
    .video-card.playing:not(.video-clone) .video-thumbnail {
      display: block;
      opacity: 1;
      transition: opacity 0.5s ease;
      z-index: 3;
    }

    .video-clone.loaded .video-thumbnail,
    .video-clone.loaded .music-thumbnail {
      opacity: 0;
      pointer-events: none;
      display: none;
      visibility: hidden;
    }

    .video-card.playing .play-btn,
    .video-card.playing .video-info {
      opacity: 0;
      pointer-events: none;
    }

    .video-card.playing iframe {
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .video-card.playing.loaded iframe {
      opacity: 1;
      transition-delay: 0.2s;
    }

    .video-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      z-index: 2;
    }

    /* Loader élégant pendant chargement vidéo */
    .video-card .video-loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
    }

    .video-card.playing.loading .video-loader {
      display: block;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Backdrop élégant sur toute la page */
    body.video-playing {
      overflow: hidden;
    }

    body.video-playing::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      z-index: 50;
      animation: backdropAppear 0.4s ease forwards;
    }

    @keyframes backdropAppear {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Autres vidéos - effet discret */
    body.video-playing .video-card:not(.playing) {
      opacity: 0.2;
      transform: scale(0.95);
      filter: blur(8px);
      transition: all 0.5s ease;
    }

    /* Bordures subtiles au hover */
    .video-card {
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Petit bounce subtil au retour */
    @keyframes smallBounce {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Animation bounce au retour (film + music) */
    .video-card.returning,
    .music-card.returning {
      animation: smallBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Overlay subtil au hover */
    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-card:hover .play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 22px solid var(--navy);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 5px;
    }

    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .video-card:hover .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-size: 16px;
      font-weight: 700;
      color: white;
      line-height: 1.4;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .video-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Music */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
    }

    .music-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-sizing: border-box;
      border: 2px solid transparent;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
    }

    .music-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .music-card.hover-1:hover:not(.playing) {
      transform: translateY(-12px) scale(1.03) rotate(1deg);
      box-shadow: 0 25px 70px rgba(109, 181, 196, 0.3);
      border-color: rgba(109, 181, 196, 0.4);
    }

    .music-card.hover-2:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotate(-2deg);
      box-shadow: 0 20px 60px rgba(227, 35, 44, 0.25);
      border-color: rgba(227, 35, 44, 0.4);
    }

    .music-card.hover-3:hover:not(.playing) {
      transform: translateY(-10px) scale(1.04) skewY(1deg);
      box-shadow: 0 22px 65px rgba(45, 56, 83, 0.3);
      border-color: rgba(45, 56, 83, 0.4);
    }

    .music-card.hover-4:hover:not(.playing) {
      transform: translateY(-15px) scale(1.02) rotateX(3deg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      border-color: rgba(0, 0, 0, 0.2);
    }

    .music-card.hover-5:hover:not(.playing) {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 22px 68px rgba(227, 35, 44, 0.28);
      border-color: rgba(227, 35, 44, 0.5);
    }

    /* Music card expanded - mode cinéma ultra stylé */
    .music-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      z-index: 10000;
      cursor: default;
      border-radius: 20px;
      animation: videoExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 0 0 1px rgba(227, 35, 44, 0.2),
        0 20px 60px rgba(227, 35, 44, 0.3),
        0 0 100px rgba(227, 35, 44, 0.15);
    }

    /* Garde la miniature visible pendant chargement - Music (sauf clone) */
    .music-card.playing:not(.video-clone) .music-thumbnail {
      display: block;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .video-clone.loaded .music-thumbnail {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .music-card.playing .play-btn,
    .music-card.playing .music-info {
      opacity: 0;
      pointer-events: none;
    }

    .music-card.playing iframe {
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .music-card.playing.loaded iframe {
      opacity: 1;
    }

    .music-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      z-index: 2;
    }

    .music-card .close-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.98);
      border: 2.5px solid rgba(227, 35, 44, 0.35);
      color: var(--navy);
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1;
      font-weight: 300;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.35),
        0 0 0 0 rgba(227, 35, 44, 0);
      backdrop-filter: blur(15px);
    }

    .music-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
      opacity: 0;
      transform: scale(0.4) rotate(-90deg);
    }

    .music-card .close-btn:hover {
      transform: scale(1.15) rotate(90deg);
      box-shadow:
        0 8px 32px rgba(227, 35, 44, 0.3),
        0 0 0 8px rgba(227, 35, 44, 0.1);
      background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
      border-color: rgba(227, 35, 44, 0.35);
      color: var(--red);
    }

    /* Autres vidéos quand une music est en lecture */
    body.video-playing .music-card:not(.playing) {
      opacity: 0.3;
      transform: scale(0.92);
      filter: blur(4px) grayscale(0.3);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .music-card:hover .music-thumbnail {
      transform: scale(1.05);
    }

    .music-card::before {
      content: '';
      position: absolute;
      inset: 0;

    const videoGrid = document.getElementById('videoGrid');

      card.innerHTML = `
        <img class="music-thumbnail" src="images/${video.id}.jpg" alt="${video.title}">

    });

    // Navigation avec History API + Swipe
    const navLinks = document.querySelectorAll('nav a');
    const pages = document.querySelectorAll('.page-section');

    function navigateToPage(pageName, pushState = true) {
      const targetPage = pageName || 'film';

      navLinks.forEach(l => l.classList.remove('active'));
      const activeLink = document.querySelector(`nav a[data-page="${targetPage}"]`);
      if (activeLink) activeLink.classList.add('active');

      // Update URL + meta tags
      if (pushState) {
        window.location.hash = targetPage;
        document.title = `Modern Freaks - ${targetPage.charAt(0).toUpperCase() + targetPage.slice(1)}`;
      }

      // Animation logo
      const logoLetters = document.querySelectorAll('.logo span');
      logoLetters.forEach((letter, index) => {
        const animClass = `animate-${Math.floor(Math.random() * 10) + 1}`;
        setTimeout(() => {
          letter.classList.add(animClass);
          setTimeout(() => letter.classList.remove(animClass), 600);
        }, index * 60);
      });

      // Switch pages
      pages.forEach(page => {
        page.classList.remove('active');
        if (page.id === `${targetPage}-page`) {
          page.classList.add('active');

          if (targetPage === 'music') {
            document.querySelectorAll('.music-card').forEach((card, i) => {
              setTimeout(() => card.classList.add('visible'), i * 80);
            });
          }
          if (targetPage === 'contact') {
            setTimeout(() => {
              document.querySelector('.contact-container').classList.add('visible');
            }, 100);
          }
        }
      });
    }

    // Click navigation
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage(link.dataset.page);
      });
    });

    // Hash change navigation
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || 'film';
      // Format: "film/video-slug" ou juste "film"
      const page = hash.split('/')[0];
      navigateToPage(page, false);
    });

    // Swipe gestures
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      const swipeThreshold = 100;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) < swipeThreshold) return;

      const currentPage = document.querySelector('nav a.active').dataset.page;
      const pageOrder = ['film', 'music', 'contact'];
      const currentIndex = pageOrder.indexOf(currentPage);

      if (diff > 0 && currentIndex < pageOrder.length - 1) {
        // Swipe left - next page
        navigateToPage(pageOrder[currentIndex + 1]);
      } else if (diff < 0 && currentIndex > 0) {
        // Swipe right - previous page
        navigateToPage(pageOrder[currentIndex - 1]);
      }
    }

    // Init page from URL hash
    const initialPage = window.location.hash.slice(1) || 'film';
    navigateToPage(initialPage, false);

    // Formulaire
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Message envoyé ! (formulaire demo)');

    // Créer un slug à partir du titre
    function createSlug(title) {
      return title
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // Retire les accents
        .replace(/[^a-z0-9\s-]/g, '') // Garde seulement lettres, chiffres, espaces et tirets
        .trim()
        .replace(/\s+/g, '-'); // Remplace espaces par tirets
    }

    function playVideo(card, title) {
      // Stop toute autre vidéo en cours
      document.querySelectorAll('.video-card.playing, .music-card.playing').forEach(c => {
        if (c !== card) {
          stopVideo(c);
        }
      });

      const videoId = card.dataset.videoId;

      // Cache la carte originale MAIS garde la thumbnail visible pour éviter flash blanc au retour
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';

      const originalThumbnail = card.querySelector('.video-thumbnail, .music-thumbnail');
      if (originalThumbnail) {
        originalThumbnail.style.position = 'absolute';
        originalThumbnail.style.inset = '0';
        originalThumbnail.style.zIndex = '-1';
        originalThumbnail.style.opacity = '1';
        originalThumbnail.style.display = 'block';
      }

      // Clone la carte pour l'animation
      const clone = card.cloneNode(true);
      clone.classList.add('video-clone');
      const cloneIframe = clone.querySelector('iframe');

      // Position du clone = position actuelle de la carte
      const startRect = card.getBoundingClientRect();
      clone.style.position = 'fixed';
      clone.style.left = startRect.left + 'px';
      clone.style.top = startRect.top + 'px';
      clone.style.width = startRect.width + 'px';
      clone.style.height = startRect.height + 'px';
      clone.style.margin = '0';
      clone.style.transition = 'none';
      clone.style.opacity = '1';
      clone.style.pointerEvents = 'auto';

      document.body.appendChild(clone);
      card._clone = clone;

      // Calcule position finale adaptée au ratio de la vidéo
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      // Détecte le ratio (16:9 par défaut, peut être surchargé avec data-ratio)
      const videoRatio = card.dataset.ratio ? eval(card.dataset.ratio) : (16 / 9);

      // Calcule taille optimale selon le ratio de la vidéo
      let maxWidth = Math.min(viewportWidth * 0.85, 1200);
      let finalHeight = maxWidth / videoRatio;

      // Vérifie si ça dépasse la hauteur disponible
      if (finalHeight > viewportHeight * 0.85) {
        finalHeight = viewportHeight * 0.85;
        maxWidth = finalHeight * videoRatio;
      }

      const finalLeft = (viewportWidth - maxWidth) / 2;
      const finalTop = (viewportHeight - finalHeight) / 2;

      // Active l'état playing
      clone.classList.add('playing', 'loading');
      document.body.classList.add('video-playing');

      // Anime le clone vers la position finale
      requestAnimationFrame(() => {
        clone.style.transition = 'all 0.5s cubic-bezier(0.32, 0.72, 0, 1)';
        clone.style.left = finalLeft + 'px';
        clone.style.top = finalTop + 'px';
        clone.style.width = maxWidth + 'px';
        clone.style.height = finalHeight + 'px';

        // Lance la vidéo
        setTimeout(() => {
          cloneIframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&quality=auto&muted=0&title=0&byline=0&portrait=0`;

          const loadTimeout = setTimeout(() => {
            clone.classList.remove('loading');
            clone.classList.add('loaded');
          }, 3000);

          cloneIframe.onload = () => {
            clearTimeout(loadTimeout);
            setTimeout(() => {
              clone.classList.remove('loading');
              clone.classList.add('loaded');
            }, 1200); // Augmenté de 400ms à 1200ms pour laisser Vimeo afficher la première frame
          };
        }, 300);

        // Bouton close sur le clone
        clone.querySelector('.close-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          stopVideo(card);
        });
      });

      // Met à jour l'URL pour permettre le partage (format: #page/video-slug)
      const currentPage = document.querySelector('nav a.active')?.dataset.page || 'film';
      const slug = createSlug(title);
      window.location.hash = `${currentPage}/${slug}`;
    }

    function stopVideo(card) {
      const clone = card._clone;
      if (!clone) return;

      const targetRect = card.getBoundingClientRect();

      document.body.classList.remove('video-playing');
      clone.classList.remove('playing', 'loaded', 'loading');

      const cloneIframe = clone.querySelector('iframe');
      const cloneThumbnail = clone.querySelector('.video-thumbnail, .music-thumbnail');

      // Cache l'iframe immédiatement
      if (cloneIframe) {
        cloneIframe.style.transition = 'none';
        cloneIframe.style.opacity = '0';
        cloneIframe.style.visibility = 'hidden';
      }

      // Thumbnail du clone visible
      if (cloneThumbnail) {
        cloneThumbnail.style.transition = 'none';
        cloneThumbnail.style.position = 'absolute';
        cloneThumbnail.style.inset = '0';
        cloneThumbnail.style.opacity = '1';
        cloneThumbnail.style.display = 'block';
      }

      // IMPORTANT: Rend la carte visible DÈS LE DÉBUT (en dessous du clone)
      card.style.transition = 'none';
      card.style.opacity = '1';
      card.style.pointerEvents = 'auto';

      clone.offsetHeight;

      // Cleanup + bounce à la fin de l'animation
      const onTransitionEnd = (e) => {
        if (e.target !== clone) return;

        clone.removeEventListener('transitionend', onTransitionEnd);

        // Petit bounce sur la carte pour effet fun et satisfaisant
        card.classList.add('returning');
        setTimeout(() => card.classList.remove('returning'), 300);

        // Remove clone après fade
        setTimeout(() => {
          if (clone.parentNode) {
            clone.parentNode.removeChild(clone);
          }
          card._clone = null;
        }, 100);
      };

      clone.addEventListener('transitionend', onTransitionEnd);

      // Animation style iPhone: rapide, fluide, bounce satisfaisant
      requestAnimationFrame(() => {
        // Dezoom avec bounce iOS (courbe spring)
        clone.style.transition = 'all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease-out 0.15s';
        clone.style.left = targetRect.left + 'px';
        clone.style.top = targetRect.top + 'px';
        clone.style.width = targetRect.width + 'px';
        clone.style.height = targetRect.height + 'px';
        clone.style.opacity = '0';
      });

      // Restaure le hash vers juste la page (enlève le /video-slug)
      const currentPage = document.querySelector('nav a.active')?.dataset.page || 'film';
      window.location.hash = currentPage;
    }

    // Escape pour fermer la vidéo
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const playingCard = document.querySelector('.video-card.playing, .music-card.playing');
        if (playingCard) stopVideo(playingCard);
      }

      // Navigation avec les flèches gauche/droite
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const playingCard = document.querySelector('.video-card.playing, .music-card.playing');
        if (!playingCard) return;

        const currentPage = document.querySelector('nav a.active').dataset.page;
        const cards = Array.from(document.querySelectorAll(
          currentPage === 'music' ? '.music-card' : '.video-card'
        ));
        const currentIndex = cards.indexOf(playingCard);

        let nextIndex;
        if (e.key === 'ArrowLeft') {
          nextIndex = currentIndex > 0 ? currentIndex - 1 : cards.length - 1;
        } else {
          nextIndex = currentIndex < cards.length - 1 ? currentIndex + 1 : 0;
        }

        const nextCard = cards[nextIndex];
        if (nextCard) {
          stopVideo(playingCard);
          setTimeout(() => {
            const videoData = currentPage === 'music' ? musicVideos : videos;
            const video = videoData.find(v => v.id === nextCard.dataset.videoId);
            if (video) playVideo(nextCard, video.title);
          }, 100);
        }
      }
    });

    // Auto-play vidéo si hash présent dans l'URL au chargement
    window.addEventListener('load', () => {
      const hash = window.location.hash.slice(1); // Retire le #
      if (hash && hash.includes('/')) {
        // Format: "film/video-slug" ou "music/video-slug"
        const [page, videoSlug] = hash.split('/');

        // Cherche la vidéo correspondant au slug
        const allVideos = [...videos, ...musicVideos];
        const matchedVideo = allVideos.find(v => createSlug(v.title) === videoSlug);

        if (matchedVideo) {
          // Trouve la carte correspondante
          const card = document.querySelector(`[data-video-id="${matchedVideo.id}"]`);
          if (card) {
            // Si c'est une vidéo music, switch vers la page music d'abord
            if (musicVideos.some(v => v.id === matchedVideo.id)) {
              const musicLink = document.querySelector('nav a[data-page="music"]');
              if (musicLink) musicLink.click();
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            } else {
              // C'est une vidéo film, joue direct
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            }
          }
        }
      }
    });
  </script>
</body>
</html>
