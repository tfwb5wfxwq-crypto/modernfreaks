<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #6DB5C4;
      --navy: #2D3853;
      --red: #E3232C;
      --white: #ffffff;
      --gray: #898F9F;
    }

    body {
      font-family: 'Europa', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--white);
      color: var(--navy);
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo FREAKS */
    .logo-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -3.5px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
    }

    .logo span {
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo span:hover {
      transform: translateY(-12px) rotate(-5deg) scale(1.15);
    }

    /* Animation wave sur les lettres du logo */
    @keyframes logoWave {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-15px) rotate(-8deg);
      }
    }

    .logo span.animate {
      animation: logoWave 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo .f { color: var(--cyan); }
    .logo .r { color: var(--navy); }
    .logo .e { color: var(--red); }
    .logo .a { color: var(--navy); }
    .logo .k { color: var(--cyan); }
    .logo .s { color: var(--red); }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gray);
      font-weight: 300;
      margin-bottom: 14px;
    }

    /* Navigation avec couleurs */
    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: var(--gray);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 12px 28px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    nav a::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    nav a[data-page="film"]::before {
      background: linear-gradient(135deg, var(--cyan), rgba(109, 181, 196, 0.6));
    }
    nav a[data-page="music"]::before {
      background: linear-gradient(135deg, var(--red), rgba(227, 35, 44, 0.6));
    }
    nav a[data-page="contact"]::before {
      background: linear-gradient(135deg, var(--navy), rgba(45, 56, 83, 0.6));
    }

    nav a:hover {
      color: var(--white);
      background: rgba(0, 0, 0, 0.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    nav a:hover::before {
      opacity: 1;
    }

    nav a.active {
      color: var(--white);
      background: transparent;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    nav a.active::before {
      opacity: 1;
    }

    nav a.active[data-page="film"] {
      box-shadow: 0 4px 20px rgba(109, 181, 196, 0.4);
    }

    nav a.active[data-page="music"] {
      box-shadow: 0 4px 20px rgba(227, 35, 44, 0.4);
    }

    nav a.active[data-page="contact"] {
      box-shadow: 0 4px 20px rgba(45, 56, 83, 0.4);
    }

    /* Sections */
    .page-section {
      display: none;
      min-height: 100vh;
      padding: 140px 60px 100px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-section.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Grid vidéos avec couleurs */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 35px;
    }

    .video-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.95);
    }

    .video-card.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Video card expanded - mode cinéma ultra stylé */
    .video-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      z-index: 100;
      cursor: default;
      border-radius: 20px;
      animation: videoExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
    }

    @keyframes videoExpand {
      from {
        transform: scale(0.8);
        opacity: 0;
        filter: blur(10px);
      }
      to {
        transform: scale(1);
        opacity: 1;
        filter: blur(0);
      }
    }

    /* Glow coloré selon la vidéo */
    .video-card.playing:nth-child(3n+1) {
      box-shadow:
        0 0 0 1px rgba(109, 181, 196, 0.2),
        0 20px 60px rgba(109, 181, 196, 0.3),
        0 0 100px rgba(109, 181, 196, 0.15);
    }

    .video-card.playing:nth-child(3n+2) {
      box-shadow:
        0 0 0 1px rgba(227, 35, 44, 0.2),
        0 20px 60px rgba(227, 35, 44, 0.3),
        0 0 100px rgba(227, 35, 44, 0.15);
    }

    .video-card.playing:nth-child(3n+3) {
      box-shadow:
        0 0 0 1px rgba(45, 56, 83, 0.2),
        0 20px 60px rgba(45, 56, 83, 0.3),
        0 0 100px rgba(45, 56, 83, 0.15);
    }

    .video-card.playing .video-thumbnail {
      display: none;
    }

    .video-card.playing .play-btn,
    .video-card.playing .video-info {
      display: none;
    }

    .video-card.playing iframe {
      display: block;
      animation: iframeAppear 0.5s ease 0.2s forwards;
      opacity: 0;
    }

    @keyframes iframeAppear {
      to {
        opacity: 1;
      }
    }

    .video-card iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    /* Backdrop blur élégant sur toute la page */
    body.video-playing {
      overflow: hidden;
    }

    body.video-playing::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(0.8);
      z-index: 50;
      animation: backdropAppear 0.4s ease forwards;
    }

    @keyframes backdropAppear {
      from {
        opacity: 0;
        backdrop-filter: blur(0);
      }
      to {
        opacity: 1;
        backdrop-filter: blur(12px) saturate(0.8);
      }
    }

    /* Autres vidéos - effet discret */
    body.video-playing .video-card:not(.playing) {
      opacity: 0.3;
      transform: scale(0.92);
      filter: blur(4px) grayscale(0.3);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Bordures colorées alternées - style iPhone */
    .video-card:nth-child(3n+1) {
      border: 2px solid transparent;
    }
    .video-card:nth-child(3n+1):hover {
      border-color: var(--cyan);
      box-shadow: 0 8px 24px rgba(109, 181, 196, 0.15);
    }

    .video-card:nth-child(3n+2) {
      border: 2px solid transparent;
    }
    .video-card:nth-child(3n+2):hover {
      border-color: var(--red);
      box-shadow: 0 8px 24px rgba(227, 35, 44, 0.15);
    }

    .video-card:nth-child(3n+3) {
      border: 2px solid transparent;
    }
    .video-card:nth-child(3n+3):hover {
      border-color: var(--navy);
      box-shadow: 0 8px 24px rgba(45, 56, 83, 0.15);
    }

    .video-card:hover {
      transform: scale(1.01);
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .video-card:hover .video-thumbnail {
      transform: scale(1.05);
    }

    /* Overlay avec gradient coloré */
    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .video-card:nth-child(3n+1)::before {
      background: linear-gradient(135deg, rgba(109, 181, 196, 0.9) 0%, transparent 60%);
    }
    .video-card:nth-child(3n+2)::before {
      background: linear-gradient(135deg, rgba(227, 35, 44, 0.9) 0%, transparent 60%);
    }
    .video-card:nth-child(3n+3)::before {
      background: linear-gradient(135deg, rgba(45, 56, 83, 0.9) 0%, transparent 60%);
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-card:hover .play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 22px solid var(--navy);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 5px;
    }

    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .video-card:hover .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-size: 16px;
      font-weight: 700;
      color: white;
      line-height: 1.4;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .video-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Music */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
    }

    .music-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
    }

    .music-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .music-card:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 24px rgba(227, 35, 44, 0.15);
      border: 2px solid var(--red);
    }

    /* Music card expanded - mode cinéma ultra stylé */
    .music-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      z-index: 100;
      cursor: default;
      border-radius: 20px;
      animation: videoExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 0 0 1px rgba(227, 35, 44, 0.2),
        0 20px 60px rgba(227, 35, 44, 0.3),
        0 0 100px rgba(227, 35, 44, 0.15);
    }

    .music-card.playing .music-thumbnail {
      display: none;
    }

    .music-card.playing .play-btn,
    .music-card.playing .music-info {
      display: none;
    }

    .music-card.playing iframe {
      display: block;
      animation: iframeAppear 0.5s ease 0.2s forwards;
      opacity: 0;
    }

    .music-card iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    .music-card .close-btn {
      display: none;
      position: absolute;
      top: -18px;
      right: -18px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid rgba(0, 0, 0, 0.06);
      color: var(--navy);
      font-size: 26px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1;
      font-weight: 300;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .music-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
      opacity: 0;
      transform: scale(0.5) rotate(-90deg);
    }

    .music-card .close-btn:hover {
      transform: rotate(90deg) scale(1.15);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      background: var(--navy);
      color: white;
    }

    /* Autres vidéos quand une music est en lecture */
    body.video-playing .music-card:not(.playing) {
      opacity: 0.3;
      transform: scale(0.92);
      filter: blur(4px) grayscale(0.3);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .music-card:hover .music-thumbnail {
      transform: scale(1.05);
    }

    .music-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(227, 35, 44, 0.85) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .music-card:hover::before {
      opacity: 1;
    }

    .music-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .music-card:hover .music-info {
      opacity: 1;
      transform: translateY(0);
    }

    .music-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .music-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Contact - Formulaire compact */
    .contact-container {
      max-width: 600px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .contact-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .contact-subtitle {
      font-size: 15px;
      color: var(--gray);
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .contact-form {
      display: grid;
      gap: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      position: relative;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.02);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--gray);
      opacity: 0.6;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--cyan);
      background: white;
      box-shadow: 0 4px 20px rgba(109, 181, 196, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    .submit-btn {
      padding: 14px 38px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--red) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      justify-self: start;
    }

    .submit-btn:hover {
      box-shadow: 0 8px 25px rgba(109, 181, 196, 0.3);
    }

    /* Player avec animation stylée */
    /* Bouton close sur vidéo en lecture - ultra stylé */
    .video-card .close-btn {
      display: none;
      position: absolute;
      top: -18px;
      right: -18px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid rgba(0, 0, 0, 0.06);
      color: var(--navy);
      font-size: 26px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1;
      font-weight: 300;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .video-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
      opacity: 0;
      transform: scale(0.5) rotate(-90deg);
    }

    @keyframes closeButtonAppear {
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .video-card .close-btn:hover {
      transform: rotate(90deg) scale(1.15);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      background: var(--navy);
      color: white;
    }

    /* Animation des vidéos quand player ouvert */
    body.player-open .video-card,
    body.player-open .music-card {
      opacity: 0.3;
      transform: scale(0.95);
      filter: blur(2px);
      transition: all 0.5s ease;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .video-grid,
      .music-grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        gap: 25px;
        padding: 25px 30px;
      }

      .logo {
        font-size: 42px;
      }

      nav {
        gap: 30px;
      }

      .page-section {
        padding: 130px 30px 80px;
      }

      .video-grid,
      .music-grid {
        grid-template-columns: 1fr;
      }

      .contact-title {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo-wrapper">
        <div class="logo">
          <span class="f">F</span><span class="r">R</span><span class="e">E</span><span class="a">A</span><span class="k">K</span><span class="s">S</span>
        </div>
        <div class="logo-sub">Modern</div>
      </div>
      <nav>
        <a href="#film" class="active" data-page="film">Film</a>
        <a href="#music" data-page="music">Music</a>
        <a href="#contact" data-page="contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- PAGE FILM -->
  <section id="film-page" class="page-section active">
    <div class="section-title">Selected Works</div>
    <div class="video-grid" id="videoGrid"></div>
  </section>

  <!-- PAGE MUSIC -->
  <section id="music-page" class="page-section">
    <div class="section-title">Music & Sound Design</div>
    <div class="music-grid" id="musicGrid"></div>
  </section>

  <!-- PAGE CONTACT -->
  <section id="contact-page" class="page-section">
    <div class="contact-container">
      <h1 class="contact-title">Let's Create Together</h1>
      <p class="contact-subtitle">Vous avez un projet en tête ? Parlons-en.</p>

      <form class="contact-form" id="contactForm">
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="name" placeholder="Votre nom" required>
          </div>
          <div class="form-group">
            <input type="email" id="email" placeholder="Votre email" required>
          </div>
        </div>
        <div class="form-group">
          <input type="text" id="subject" placeholder="Sujet" required>
        </div>
        <div class="form-group">
          <textarea id="message" placeholder="Votre message" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Envoyer</button>
      </form>
    </div>
  </section>


  <script>
    const videos = [
      { id: "1125470403", title: "Bodins_Le desert_Chefchaouene" },
      { id: "1125480221", title: "Bodins_Le desert" },

    const musicGrid = document.getElementById('musicGrid');

    // Générer vidéos Film
    videos.forEach((video, index) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.dataset.videoId = video.id;
      card.innerHTML = `
        <img class="video-thumbnail" src="images/${video.id}.jpg" alt="${video.title}">
        <iframe src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
        <button class="close-btn">×</button>
        <div class="play-btn"></div>
        <div class="video-info">
          <div class="video-title">${video.title}</div>
          <div class="video-meta">Film</div>
        </div>
      `;

      card.querySelector('.video-thumbnail').addEventListener('click', () => playVideo(card));
      card.querySelector('.play-btn').addEventListener('click', () => playVideo(card));
      card.querySelector('.close-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        stopVideo(card);
      });

      videoGrid.appendChild(card);
      setTimeout(() => card.classList.add('visible'), index * 40);
    });

        <img class="music-thumbnail" src="images/${video.id}.jpg" alt="${video.title}">

        <button class="close-btn">×</button>

    // Navigation
    const navLinks = document.querySelectorAll('nav a');
    const pages = document.querySelectorAll('.page-section');

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetPage = link.dataset.page;

        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');

        // Animation wave des lettres du logo
        const logoLetters = document.querySelectorAll('.logo span');
        logoLetters.forEach((letter, index) => {
          setTimeout(() => {
            letter.classList.add('animate');
            setTimeout(() => letter.classList.remove('animate'), 600);
          }, index * 60);
        });

        pages.forEach(page => {
          page.classList.remove('active');
          if (page.id === `${targetPage}-page`) {
            page.classList.add('active');

            if (targetPage === 'music') {
              document.querySelectorAll('.music-card').forEach((card, i) => {

    function playVideo(card) {
      // Stop toute autre vidéo en cours
      document.querySelectorAll('.video-card.playing, .music-card.playing').forEach(c => {
        c.classList.remove('playing');
        c.querySelector('iframe').src = '';
      });

      // Lance cette vidéo
      const videoId = card.dataset.videoId;
      const iframe = card.querySelector('iframe');
      iframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&quality=1080p`;
      card.classList.add('playing');
      document.body.classList.add('video-playing');

      // Scroll vers la vidéo
      setTimeout(() => {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }

    function stopVideo(card) {
      card.classList.remove('playing');
      card.querySelector('iframe').src = '';
      document.body.classList.remove('video-playing');
    }

    // Escape pour fermer la vidéo
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const playingCard = document.querySelector('.video-card.playing, .music-card.playing');
        if (playingCard) stopVideo(playingCard);
      }
    });
