<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #6DB5C4;
      --navy: #2D3853;
      --red: #E3232C;
      --white: #ffffff;
      --gray: #898F9F;
    }

    body {
      font-family: 'Europa', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--white);
      color: var(--navy);
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo FREAKS */
    .logo-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -3.5px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
    }

    .logo span {
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo span:hover {
      transform: translateY(-12px) rotate(-5deg) scale(1.15);
    }

    /* 10 animations différentes pour les lettres du logo */
    @keyframes logoAnim1 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-18px) rotate(-10deg) scale(1.15); }
    }

    @keyframes logoAnim2 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(15deg); }
    }

    @keyframes logoAnim3 {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.2); }
      60% { transform: translateY(-8px) scale(0.95); }
    }

    @keyframes logoAnim4 {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-15px) rotateX(360deg); }
    }

    @keyframes logoAnim5 {
      0%, 100% { transform: translateY(0) skewY(0deg); }
      50% { transform: translateY(-14px) skewY(10deg); }
    }

    @keyframes logoAnim6 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-10px) rotate(-5deg) scale(1.1); }
      75% { transform: translateY(-16px) rotate(8deg) scale(1.05); }
    }

    @keyframes logoAnim7 {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-12px) rotateY(180deg); }
    }

    @keyframes logoAnim8 {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-22px) scale(0.9) rotate(20deg); }
    }

    @keyframes logoAnim9 {
      0%, 100% { transform: translateY(0); }
      20% { transform: translateY(-25px); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-18px); }
      80% { transform: translateY(-6px); }
    }

    @keyframes logoAnim10 {
      0%, 100% { transform: translateY(0) rotate(0deg) skewX(0deg); }
      50% { transform: translateY(-16px) rotate(-12deg) skewX(-5deg); }
    }

    .logo span.animate-1 { animation: logoAnim1 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-2 { animation: logoAnim2 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-3 { animation: logoAnim3 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-4 { animation: logoAnim4 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-5 { animation: logoAnim5 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-6 { animation: logoAnim6 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-7 { animation: logoAnim7 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-8 { animation: logoAnim8 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-9 { animation: logoAnim9 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-10 { animation: logoAnim10 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .logo .f { color: var(--cyan); }
    .logo .r { color: var(--navy); }
    .logo .e { color: var(--red); }
    .logo .a { color: var(--navy); }
    .logo .k { color: var(--cyan); }
    .logo .s { color: var(--red); }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gray);
      font-weight: 300;
      margin-bottom: 14px;
    }

    /* Navigation avec couleurs */
    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: var(--gray);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 12px 28px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.03);
      overflow: hidden;
    }

    nav a::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    nav a[data-page="film"]::before {
      background: linear-gradient(135deg, var(--cyan), rgba(109, 181, 196, 0.6));
    }
    nav a[data-page="music"]::before {
      background: linear-gradient(135deg, var(--red), rgba(227, 35, 44, 0.6));
    }
    nav a[data-page="contact"]::before {
      background: linear-gradient(135deg, var(--navy), rgba(45, 56, 83, 0.6));
    }

    nav a:hover {
      color: var(--white);
      background: rgba(0, 0, 0, 0.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    nav a:hover::before {
      opacity: 1;
    }

    nav a.active {
      color: var(--white);
      background: transparent;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    nav a.active::before {
      opacity: 1;
    }

    nav a.active[data-page="film"] {
      box-shadow: 0 4px 20px rgba(109, 181, 196, 0.4);
    }

    nav a.active[data-page="music"] {
      box-shadow: 0 4px 20px rgba(227, 35, 44, 0.4);
    }

    nav a.active[data-page="contact"] {
      box-shadow: 0 4px 20px rgba(45, 56, 83, 0.4);
    }

    /* Sections */
    .page-section {
      display: none;
      min-height: 100vh;
      padding: 140px 60px 100px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-section.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Grid vidéos avec couleurs */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    .video-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.95);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .video-card.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 10 effets hover différents - assignés aléatoirement */
    .video-card.hover-1:hover {
      transform: translateY(-12px) scale(1.03) rotate(1deg);
      box-shadow: 0 25px 70px rgba(109, 181, 196, 0.3);
      z-index: 10;
    }

    .video-card.hover-2:hover {
      transform: translateY(-8px) scale(1.05) rotate(-2deg);
      box-shadow: 0 20px 60px rgba(227, 35, 44, 0.25);
      z-index: 10;
    }

    .video-card.hover-3:hover {
      transform: translateY(-10px) scale(1.04) skewY(1deg);
      box-shadow: 0 22px 65px rgba(45, 56, 83, 0.3);
      z-index: 10;
    }

    .video-card.hover-4:hover {
      transform: translateY(-15px) scale(1.02) rotateX(3deg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    .video-card.hover-5:hover {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 20px 70px rgba(109, 181, 196, 0.35);
      z-index: 10;
    }

    .video-card.hover-6:hover {
      transform: translateY(-12px) scale(1.04) rotate(2deg) perspective(500px);
      box-shadow: 0 25px 75px rgba(227, 35, 44, 0.3);
      z-index: 10;
    }

    .video-card.hover-7:hover {
      transform: translateY(-8px) scale(1.05) rotateY(2deg);
      box-shadow: 0 18px 60px rgba(45, 56, 83, 0.28);
      z-index: 10;
    }

    .video-card.hover-8:hover {
      transform: translateY(-14px) scale(1.03) skewX(-1deg);
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.22);
      z-index: 10;
    }

    .video-card.hover-9:hover {
      transform: translateY(-10px) scale(1.05) rotate(-1deg);
      box-shadow: 0 22px 68px rgba(109, 181, 196, 0.32);
      z-index: 10;
    }

    .video-card.hover-10:hover {
      transform: translateY(-16px) scale(1.02) perspective(800px) rotateX(-2deg);
      box-shadow: 0 30px 85px rgba(227, 35, 44, 0.28);
      z-index: 10;
    }

    .video-card:hover .video-thumbnail {
      transform: scale(1.05);
    }

    /* Video card expanded - mode cinéma CLEAN & ÉLÉGANT */
    .video-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 40px auto;
      aspect-ratio: 16 / 9;
      z-index: 100;
      cursor: default;
      border-radius: 20px;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 40px 100px rgba(0, 0, 0, 0.25),
        0 20px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .video-card.playing.animating-open {
      animation: none;
    }

    .video-card.playing.animating-close {
      animation: none;
    }

    .video-card.playing .video-thumbnail {
      display: none;
    }

    .video-card.playing .play-btn,
    .video-card.playing .video-info {
      display: none;
    }

    .video-card.playing iframe {
      display: block;
      animation: iframeAppear 0.5s ease 0.2s forwards;
      opacity: 0;
    }

    @keyframes iframeAppear {
      to {
        opacity: 1;
      }
    }

    .video-card iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    /* Backdrop élégant sur toute la page */
    body.video-playing {
      overflow: hidden;
    }

    body.video-playing::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      z-index: 50;
      animation: backdropAppear 0.4s ease forwards;
    }

    @keyframes backdropAppear {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Autres vidéos - effet discret */
    body.video-playing .video-card:not(.playing) {
      opacity: 0.2;
      transform: scale(0.95);
      filter: blur(8px);
      transition: all 0.5s ease;
    }

    /* Bordures subtiles au hover */
    .video-card {
      border: 2px solid transparent;
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Overlay subtil au hover */
    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-card:hover .play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 22px solid var(--navy);
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 5px;
    }

    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .video-card:hover .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-size: 16px;
      font-weight: 700;
      color: white;
      line-height: 1.4;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .video-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Music */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
    }

    .music-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
    }

    .music-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .music-card:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 24px rgba(227, 35, 44, 0.15);
      border: 2px solid var(--red);
    }

    /* Music card expanded - mode cinéma ultra stylé */
    .music-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      z-index: 100;
      cursor: default;
      border-radius: 20px;
      animation: videoExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 0 0 1px rgba(227, 35, 44, 0.2),
        0 20px 60px rgba(227, 35, 44, 0.3),
        0 0 100px rgba(227, 35, 44, 0.15);
    }

    .music-card.playing .music-thumbnail {
      display: none;
    }

    .music-card.playing .play-btn,
    .music-card.playing .music-info {
      display: none;
    }

    .music-card.playing iframe {
      display: block;
      animation: iframeAppear 0.5s ease 0.2s forwards;
      opacity: 0;
    }

    .music-card iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
    }

    .music-card .close-btn {
      display: none;
      position: absolute;
      top: -24px;
      right: -24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--navy);
      border: 4px solid white;
      color: white;
      font-size: 34px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
      font-weight: 400;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .music-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
      opacity: 0;
      transform: scale(0.5);
    }

    .music-card .close-btn:hover {
      transform: scale(1.15) rotate(90deg);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
      background: var(--red);
    }

    /* Autres vidéos quand une music est en lecture */
    body.video-playing .music-card:not(.playing) {
      opacity: 0.3;
      transform: scale(0.92);
      filter: blur(4px) grayscale(0.3);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .music-card:hover .music-thumbnail {
      transform: scale(1.05);
    }

    .music-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(227, 35, 44, 0.85) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .music-card:hover::before {
      opacity: 1;
    }

    .music-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 2;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .music-card:hover .music-info {
      opacity: 1;
      transform: translateY(0);
    }

    .music-title {
      font-size: 18px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .music-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Contact - Formulaire compact */
    .contact-container {
      max-width: 600px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }

    .contact-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-title {
      font-size: 36px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .contact-subtitle {
      font-size: 15px;
      color: var(--gray);
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .contact-form {
      display: grid;
      gap: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      position: relative;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.02);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--gray);
      opacity: 0.6;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--cyan);
      background: white;
      box-shadow: 0 4px 20px rgba(109, 181, 196, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 110px;
    }

    .submit-btn {
      padding: 14px 38px;
      background: linear-gradient(135deg, var(--cyan) 0%, var(--red) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      justify-self: start;
    }

    .submit-btn:hover {
      box-shadow: 0 8px 25px rgba(109, 181, 196, 0.3);
    }

    /* Player avec animation stylée */
    /* Bouton close ULTRA VISIBLE */
    .video-card .close-btn {
      display: none;
      position: absolute;
      top: -24px;
      right: -24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--navy);
      border: 4px solid white;
      color: white;
      font-size: 34px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      line-height: 1;
      font-weight: 400;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .video-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
      opacity: 0;
      transform: scale(0.5);
    }

    @keyframes closeButtonAppear {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .video-card .close-btn:hover {
      transform: scale(1.15) rotate(90deg);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
      background: var(--red);
    }

    /* Animation des vidéos quand player ouvert */
    body.player-open .video-card,
    body.player-open .music-card {
      opacity: 0.3;
      transform: scale(0.95);
      filter: blur(2px);
      transition: all 0.5s ease;
    }

    /* Responsive */
    @media (max-width: 1400px) {
      .video-grid,
      .music-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
      }
    }

    @media (max-width: 1024px) {
      .video-grid,
      .music-grid {

    const videoGrid = document.getElementById('videoGrid');

    // Générer vidéos Film
    videos.forEach((video, index) => {

      card.querySelector('.video-thumbnail').addEventListener('click', () => playVideo(card, video.title));

    // Générer vidéos Music

    // Navigation

    navLinks.forEach(link => {

    document.getElementById('contactForm').addEventListener('submit', (e) => {

    // Créer un slug à partir du titre
    function createSlug(title) {
      return title
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // Retire les accents
        .replace(/[^a-z0-9\s-]/g, '') // Garde seulement lettres, chiffres, espaces et tirets
        .trim()
        .replace(/\s+/g, '-'); // Remplace espaces par tirets
    }

    function playVideo(card, title) {
      // Stop toute autre vidéo en cours
      document.querySelectorAll('.video-card.playing, .music-card.playing').forEach(c => {
        c.classList.remove('playing', 'animating-open', 'animating-close');
        c.querySelector('iframe').src = '';
      });

      // Capture position initiale pour hero animation
      const initialRect = card.getBoundingClientRect();
      const initialX = initialRect.left;
      const initialY = initialRect.top;
      const initialWidth = initialRect.width;
      const initialHeight = initialRect.height;

      // Lance cette vidéo
      const videoId = card.dataset.videoId;
      const iframe = card.querySelector('iframe');
      iframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&quality=1080p`;
      card.classList.add('playing', 'animating-open');
      document.body.classList.add('video-playing');

      // Calcule la position finale
      requestAnimationFrame(() => {
        const finalRect = card.getBoundingClientRect();
        const finalX = finalRect.left;
        const finalY = finalRect.top;
        const finalWidth = finalRect.width;
        const finalHeight = finalRect.height;

        // Calcule les deltas
        const deltaX = initialX - finalX;
        const deltaY = initialY - finalY;
        const scaleX = initialWidth / finalWidth;
        const scaleY = initialHeight / finalHeight;

        // Démarre de la position initiale
        card.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scaleX}, ${scaleY})`;
        card.style.opacity = '1';

        // Anime vers la position finale
        requestAnimationFrame(() => {
          card.style.transform = 'translate(0, 0) scale(1, 1)';
        });

        // Nettoie après l'animation
        setTimeout(() => {
          card.classList.remove('animating-open');
          card.style.transform = '';
        }, 500);
      });

      // Met à jour l'URL avec le slug
      const slug = createSlug(title);
      window.location.hash = slug;

      // Scroll vers la vidéo après un délai
      setTimeout(() => {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 600);
    }

    function stopVideo(card) {
      // Capture position actuelle
      const currentRect = card.getBoundingClientRect();

      // Retire l'état playing pour calculer la position de retour
      card.classList.remove('playing');
      card.classList.add('animating-close');

      requestAnimationFrame(() => {
        const targetRect = card.getBoundingClientRect();
        const deltaX = currentRect.left - targetRect.left;
        const deltaY = currentRect.top - targetRect.top;
        const scaleX = currentRect.width / targetRect.width;
        const scaleY = currentRect.height / targetRect.height;

        // Remet playing temporairement pour l'animation
        card.classList.add('playing');

        // Démarre de la position actuelle
        card.style.transform = 'translate(0, 0) scale(1, 1)';

        // Anime vers la position de retour
        requestAnimationFrame(() => {
          card.style.transform = `translate(${-deltaX}px, ${-deltaY}px) scale(${1/scaleX}, ${1/scaleY})`;
          card.style.opacity = '1';
        });

        // Nettoie après l'animation
        setTimeout(() => {
          card.classList.remove('playing', 'animating-close');
          card.querySelector('iframe').src = '';
          card.style.transform = '';
          card.style.opacity = '';
          document.body.classList.remove('video-playing');
        }, 500);
      });

      // Retire le hash de l'URL
      history.replaceState(null, null, ' ');
    }

    // Escape pour fermer la vidéo
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const playingCard = document.querySelector('.video-card.playing, .music-card.playing');
        if (playingCard) stopVideo(playingCard);
      }
    });

    // Auto-play vidéo si hash présent dans l'URL au chargement
    window.addEventListener('load', () => {
      const hash = window.location.hash.slice(1); // Retire le #
      if (hash) {
        // Cherche la vidéo correspondant au slug
        const allVideos = [...videos, ...musicVideos];
        const matchedVideo = allVideos.find(v => createSlug(v.title) === hash);

        if (matchedVideo) {
          // Trouve la carte correspondante
          const card = document.querySelector(`[data-video-id="${matchedVideo.id}"]`);
          if (card) {
            // Si c'est une vidéo music, switch vers la page music d'abord
            if (musicVideos.some(v => v.id === matchedVideo.id)) {
              const musicLink = document.querySelector('nav a[data-page="music"]');
              if (musicLink) musicLink.click();
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            } else {
              // C'est une vidéo film, joue direct
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            }
          }
        }
      }
    });
