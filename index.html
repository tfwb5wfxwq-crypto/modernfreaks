<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #6DB5C4;
      --navy: #2D3853;
      --red: #E3232C;
      --white: #ffffff;
      --gray: #898F9F;
    }

    body {
      font-family: 'Europa', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--white);
      color: var(--navy);
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Header flou et assombri quand vidéo ouverte */
    body.video-playing header {
      background: rgba(240, 240, 240, 0.6);
      backdrop-filter: blur(40px) brightness(0.95);
      border-bottom-color: rgba(0, 0, 0, 0.02);
    }

    body.video-playing header .logo,
    body.video-playing header nav a {
      opacity: 0.4;
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo FREAKS */
    .logo-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 15px;
    }

    .logo {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -3.5px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
    }

    .logo span {
      display: inline-block;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo span:hover {
      transform: translateY(-12px) rotate(-5deg) scale(1.15);
    }

    /* 10 animations différentes pour les lettres du logo */
    @keyframes logoAnim1 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-18px) rotate(-10deg) scale(1.15); }
    }

    @keyframes logoAnim2 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(15deg); }
    }

    @keyframes logoAnim3 {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.2); }
      60% { transform: translateY(-8px) scale(0.95); }
    }

    @keyframes logoAnim4 {
      0%, 100% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-15px) rotateX(360deg); }
    }

    @keyframes logoAnim5 {
      0%, 100% { transform: translateY(0) skewY(0deg); }
      50% { transform: translateY(-14px) skewY(10deg); }
    }

    @keyframes logoAnim6 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      25% { transform: translateY(-10px) rotate(-5deg) scale(1.1); }
      75% { transform: translateY(-16px) rotate(8deg) scale(1.05); }
    }

    @keyframes logoAnim7 {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50% { transform: translateY(-12px) rotateY(180deg); }
    }

    @keyframes logoAnim8 {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-22px) scale(0.9) rotate(20deg); }
    }

    @keyframes logoAnim9 {
      0%, 100% { transform: translateY(0); }
      20% { transform: translateY(-25px); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-18px); }
      80% { transform: translateY(-6px); }
    }

    @keyframes logoAnim10 {
      0%, 100% { transform: translateY(0) rotate(0deg) skewX(0deg); }
      50% { transform: translateY(-16px) rotate(-12deg) skewX(-5deg); }
    }

    .logo span.animate-1 { animation: logoAnim1 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-2 { animation: logoAnim2 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-3 { animation: logoAnim3 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-4 { animation: logoAnim4 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-5 { animation: logoAnim5 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-6 { animation: logoAnim6 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-7 { animation: logoAnim7 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-8 { animation: logoAnim8 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-9 { animation: logoAnim9 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .logo span.animate-10 { animation: logoAnim10 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .logo .f { color: var(--cyan); }
    .logo .r { color: var(--navy); }
    .logo .e { color: var(--red); }
    .logo .a { color: var(--navy); }
    .logo .k { color: var(--cyan); }
    .logo .s { color: var(--red); }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gray);
      font-weight: 300;
      margin-bottom: 14px;
    }

    /* Navigation ULTRA PREMIUM - Minimaliste luxe */
    nav {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    nav a {
      color: var(--gray);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      padding: 8px 0;
      background: transparent;
    }

    /* Ligne subtile sous le bouton actif */
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    nav a:hover {
      color: var(--navy);
    }

    nav a:hover::after {
      transform: scaleX(1);
    }

    nav a.active {
      color: var(--navy);
      font-weight: 500;
    }

    nav a.active::after {
      transform: scaleX(1);
    }

    nav a.active[data-page="film"] {
      color: var(--cyan);
    }

    nav a.active[data-page="music"] {
      color: var(--red);
    }

    nav a.active[data-page="contact"] {
      color: var(--navy);
    }

    /* Sections */
    .page-section {
      display: none;
      padding: 140px 60px 100px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .page-section.active {
      display: block;
      min-height: 100vh;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 60px;
      font-weight: 400;
    }

    /* Grid vidéos avec couleurs */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
    }

    .video-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: scale(0.95);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    /* Clone en position fixed - propriétés identiques à l'original */
    /* Styles communs pour tous les clones (film + music) */
    .video-clone {
      overflow: hidden;
      box-sizing: border-box;
      border: 2px solid transparent;
      border-radius: 20px;
      z-index: 9999;
    }

    /* Thumbnail du clone commence visible, fade out avec loaded */
    .video-clone .video-thumbnail,
    .video-clone .music-thumbnail {
      position: absolute;
      inset: 0;
      z-index: 1;
      transition: opacity 0.8s ease;
    }

    .video-card.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 10 effets hover différents - assignés aléatoirement */
    /* Désactive hover si vidéo en lecture */
    .video-card.playing:hover {
      transform: none !important;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 40px 100px rgba(0, 0, 0, 0.25),
        0 20px 40px rgba(0, 0, 0, 0.15) !important;
    }

    .video-card.hover-1:hover:not(.playing) {
      transform: translateY(-12px) scale(1.03) rotate(1deg);
      box-shadow: 0 25px 70px rgba(109, 181, 196, 0.3);
      z-index: 10;
    }

    .video-card.hover-2:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotate(-2deg);
      box-shadow: 0 20px 60px rgba(227, 35, 44, 0.25);
      z-index: 10;
    }

    .video-card.hover-3:hover:not(.playing) {
      transform: translateY(-10px) scale(1.04) skewY(1deg);
      box-shadow: 0 22px 65px rgba(45, 56, 83, 0.3);
      z-index: 10;
    }

    .video-card.hover-4:hover:not(.playing) {
      transform: translateY(-15px) scale(1.02) rotateX(3deg);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    .video-card.hover-5:hover:not(.playing) {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 20px 70px rgba(109, 181, 196, 0.35);
      z-index: 10;
    }

    .video-card.hover-6:hover:not(.playing) {
      transform: translateY(-12px) scale(1.04) rotate(2deg) perspective(500px);
      box-shadow: 0 25px 75px rgba(227, 35, 44, 0.3);
      z-index: 10;
    }

    .video-card.hover-7:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotateY(2deg);
      box-shadow: 0 18px 60px rgba(45, 56, 83, 0.28);
      z-index: 10;
    }

    .video-card.hover-8:hover:not(.playing) {
      transform: translateY(-14px) scale(1.03) skewX(-1deg);
      box-shadow: 0 28px 75px rgba(0, 0, 0, 0.22);
      z-index: 10;
    }

    .video-card.hover-9:hover:not(.playing) {
      transform: translateY(-10px) scale(1.05) rotate(-1deg);
      box-shadow: 0 22px 68px rgba(109, 181, 196, 0.32);
      z-index: 10;
    }

    .video-card.hover-10:hover:not(.playing) {
      transform: translateY(-16px) scale(1.02) perspective(800px) rotateX(-2deg);
      box-shadow: 0 30px 85px rgba(227, 35, 44, 0.28);
      z-index: 10;
    }

    .video-card:hover:not(.playing) .video-thumbnail {
      transform: scale(1.05);
    }

    /* Désactive tous les effets internes quand vidéo en lecture */
    .video-card.playing:hover .video-thumbnail {
      transform: none;
    }

    .video-card.playing:hover::before {
      opacity: 0 !important;
    }

    .video-card.playing:hover .play-btn,
    .video-card.playing:hover .video-info {
      opacity: 0 !important;
    }

    /* Video card expanded - mode cinéma CLEAN & ÉLÉGANT */
    .video-card.playing {
      position: fixed !important;
      z-index: 10000;
      cursor: default;
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.08),
        0 40px 100px rgba(0, 0, 0, 0.25),
        0 20px 40px rgba(0, 0, 0, 0.15);
      transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Animation ultra fluide GPU-accelerated */
    .video-card {
      will-change: transform;
      transition: all 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* Anti-scintillement sur les éléments internes */
    .video-card .play-btn,
    .video-card .video-info,
    .video-card::before {
      transition: all 0.5s ease;
    }

    /* Garde la miniature visible pendant chargement (sauf clone) */
    .video-card.playing:not(.video-clone) .video-thumbnail {
      display: block;
      opacity: 1;
      transition: opacity 0.5s ease;
      z-index: 3;
    }

    .video-clone.loaded .video-thumbnail,
    .video-clone.loaded .music-thumbnail {
      opacity: 0; /* Crossfade avec iframe qui monte à opacity: 1 */
      pointer-events: none;
    }

    .video-card.playing .play-btn,
    .video-card.playing .video-info {
      opacity: 0;
      pointer-events: none;
    }

    .video-card.playing iframe {
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .video-card.playing.loaded iframe {
      opacity: 1;
      transition-delay: 0.2s;
    }

    .video-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      z-index: 2; /* Au-dessus de la miniature (z-index: 1) pour crossfade */
    }

    /* Loader élégant pendant chargement vidéo */
    .video-card .video-loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
    }

    .video-card.playing.loading .video-loader {
      display: block;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Backdrop élégant sur toute la page */
    body.video-playing {
      overflow: hidden;
    }

    body.video-playing::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      z-index: 50;
      animation: backdropAppear 0.4s ease forwards;
    }

    @keyframes backdropAppear {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Autres vidéos - effet discret */
    body.video-playing .video-card:not(.playing) {
      opacity: 0.2;
      transform: scale(0.95);
      filter: blur(8px);
      transition: all 0.5s ease;
    }

    /* Bordures subtiles au hover */
    .video-card {
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* Petit bounce subtil au retour */
    @keyframes smallBounce {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Animation bounce au retour (film + music) */
    .video-card.returning,
    .music-card.returning {
      animation: smallBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Overlay subtil au hover */
    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.6) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      z-index: 2;
      justify-content: center;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .video-card:hover .play-btn {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 16px solid var(--navy);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      margin-left: 3px;
    }

    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      z-index: 3;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
    }

    .video-card:hover .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-size: 13px;
      font-weight: 700;
      color: white;
      line-height: 1.3;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .video-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 1px;
    }

    /* Page Music */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 30px;
    }

    .music-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-sizing: border-box;
      border: 2px solid transparent;
      cursor: pointer;
      background: #f5f5f5;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
    }

    .music-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .music-card.hover-1:hover:not(.playing) {
      transform: translateY(-12px) scale(1.03) rotate(1deg);
      box-shadow: 0 25px 70px rgba(109, 181, 196, 0.3);
      border-color: rgba(109, 181, 196, 0.4);
    }

    .music-card.hover-2:hover:not(.playing) {
      transform: translateY(-8px) scale(1.05) rotate(-2deg);
      box-shadow: 0 20px 60px rgba(109, 181, 196, 0.25);
      border-color: rgba(109, 181, 196, 0.4);
    }

    .music-card.hover-3:hover:not(.playing) {
      transform: translateY(-10px) scale(1.04) skewY(1deg);
      box-shadow: 0 22px 65px rgba(109, 181, 196, 0.3);
      border-color: rgba(109, 181, 196, 0.4);
    }

    .music-card.hover-4:hover:not(.playing) {
      transform: translateY(-15px) scale(1.02) rotateX(3deg);
      box-shadow: 0 30px 80px rgba(109, 181, 196, 0.25);
      border-color: rgba(109, 181, 196, 0.3);
    }

    .music-card.hover-5:hover:not(.playing) {
      transform: translateY(-10px) scale(1.06);
      box-shadow: 0 22px 68px rgba(109, 181, 196, 0.28);
      border-color: rgba(109, 181, 196, 0.5);
    }

    /* Music card expanded - mode cinéma ultra stylé */
    .music-card.playing {
      grid-column: 1 / -1;
      max-width: 1200px;
      width: 85%;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      z-index: 10000;
      cursor: default;
      border-radius: 20px;
      animation: videoExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 0 0 1px rgba(227, 35, 44, 0.2),
        0 20px 60px rgba(227, 35, 44, 0.3),
        0 0 100px rgba(227, 35, 44, 0.15);
    }

    /* Garde la miniature visible pendant chargement - Music (sauf clone) */
    .music-card.playing:not(.video-clone) .music-thumbnail {
      display: block;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .video-clone.loaded .music-thumbnail {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .music-card.playing .play-btn,
    .music-card.playing .music-info {
      opacity: 0;
      pointer-events: none;
    }

    .music-card.playing iframe {
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .music-card.playing.loaded iframe {
      opacity: 1;
    }

    .music-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      z-index: 2;
    }

    .music-card .close-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 40px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.98);
      border: 2.5px solid rgba(227, 35, 44, 0.35);
      color: var(--navy);
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1;
      font-weight: 300;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.35),
        0 0 0 0 rgba(227, 35, 44, 0);
      backdrop-filter: blur(15px);
    }

    .music-card.playing .close-btn {
      display: flex;
      animation: closeButtonAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
      opacity: 0;
      transform: scale(0.4) rotate(-90deg);
    }

    .music-card .close-btn:hover {
      transform: scale(1.15) rotate(90deg);
      box-shadow:
        0 8px 32px rgba(227, 35, 44, 0.3),
        0 0 0 8px rgba(227, 35, 44, 0.1);
      background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
      border-color: rgba(227, 35, 44, 0.35);
      color: var(--red);
    }

    /* Autres vidéos quand une music est en lecture */
    body.video-playing .music-card:not(.playing) {
      opacity: 0.3;
      transform: scale(0.92);
      filter: blur(4px) grayscale(0.3);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .music-card:hover .music-thumbnail {
      transform: scale(1.05);
    }

    .music-card::before {
      content: '';

      transform: translateY(-1px) scale(0.98);
    }

      pointer-events: none;
      position: relative;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;

          if (targetPage === 'contact') {
            setTimeout(() => {
              document.querySelector('.contact-container').classList.add('visible');
            }, 100);
          }
        }
      });
    }

    // Click navigation
    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        navigateToPage(link.dataset.page);
      });
    });

    // Hash change navigation
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || 'film';
      // Format: "film/video-slug" ou juste "film"
      const page = hash.split('/')[0];
      navigateToPage(page, false);
    });

    // Swipe gestures
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      const swipeThreshold = 100;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) < swipeThreshold) return;

      const currentPage = document.querySelector('nav a.active').dataset.page;
      const pageOrder = ['film', 'music', 'contact'];
      const currentIndex = pageOrder.indexOf(currentPage);

      if (diff > 0 && currentIndex < pageOrder.length - 1) {
        // Swipe left - next page
        navigateToPage(pageOrder[currentIndex + 1]);
      } else if (diff < 0 && currentIndex > 0) {
        // Swipe right - previous page
        navigateToPage(pageOrder[currentIndex - 1]);
      }
    }

    // Keyboard navigation (flèches gauche/droite)
    document.addEventListener('keydown', (e) => {
      // Ignorer si on est en train de taper dans un input/textarea
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      // Ignorer si une vidéo est en lecture
      if (document.querySelector('.video-card.playing, .music-card.playing')) return;

      const currentPage = document.querySelector('nav a.active').dataset.page;
      const pageOrder = ['film', 'music', 'contact'];
      const currentIndex = pageOrder.indexOf(currentPage);

      if (e.key === 'ArrowRight' && currentIndex < pageOrder.length - 1) {
        // Flèche droite - page suivante
        e.preventDefault();
        navigateToPage(pageOrder[currentIndex + 1]);
      } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
        // Flèche gauche - page précédente
        e.preventDefault();
        navigateToPage(pageOrder[currentIndex - 1]);
      }
    });

    // Init page from URL hash
    const initialPage = window.location.hash.slice(1) || 'film';
    navigateToPage(initialPage, false);

    // Toast notification system
    function showToast(title, message, type = 'success') {
      // Retirer les anciens toasts
      document.querySelectorAll('.toast').forEach(t => t.remove());

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <div class="toast-icon">${type === 'success' ? '✓' : '✕'}</div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
      `;

      document.body.appendChild(toast);

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);

      // Auto-remove after 4s
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    // Afficher titre vidéo en overlay (navigation flèches)
    function showVideoTitle(title) {
      // Retirer ancien overlay
      document.querySelectorAll('.video-title-overlay').forEach(o => o.remove());

      const overlay = document.createElement('div');
      overlay.className = 'video-title-overlay';
      overlay.innerHTML = `<div class="video-title-overlay-text">${title}</div>`;

      document.body.appendChild(overlay);

      // Trigger animation
      setTimeout(() => overlay.classList.add('show'), 10);

      // Auto-remove after 2.5s
      setTimeout(() => {
        overlay.classList.remove('show');
        setTimeout(() => overlay.remove(), 400);
      }, 2500);
    }

    // Validation custom du formulaire
    const contactForm = document.getElementById('contactForm');
    const formInputs = contactForm.querySelectorAll('input, textarea');

    // Messages de validation personnalisés
    formInputs.forEach(input => {
      input.addEventListener('invalid', (e) => {
        e.preventDefault();

        let message = '';
        if (input.validity.valueMissing) {
          const labels = {
            name: 'Ton nom',
            email: 'Ton email',
            subject: 'Un sujet',
            message: 'Un message'
          };
          message = `${labels[input.name] || 'Ce champ'} est requis`;
        } else if (input.validity.typeMismatch && input.type === 'email') {
          message = 'Entre une adresse email valide';
        }

        showToast('Oups !', message, 'error');
        input.focus();
      });
    });

    // Formulaire avec animation stylée
    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Validation manuelle
      if (!contactForm.checkValidity()) {
        // Le listener 'invalid' va gérer les messages
        return;
      }

      const submitBtn = e.target.querySelector('.submit-btn');
      const originalText = submitBtn.textContent;

      // Animation loading
      submitBtn.textContent = '';
      submitBtn.classList.add('loading');

      // Simuler envoi (remplace par vraie requête API)
      await new Promise(resolve => setTimeout(resolve, 1500));

      // Animation success
      submitBtn.classList.remove('loading');
      submitBtn.classList.add('success');
      submitBtn.textContent = '✓ Envoyé !';

      // Toast notification
      showToast(
        'Message envoyé !',
        'Merci pour votre message, nous vous répondrons rapidement.',
        'success'
      );

      // Reset form
      setTimeout(() => {
        e.target.reset();
        submitBtn.textContent = originalText;
        submitBtn.classList.remove('success');
      }, 2000);
    });

    // Créer un slug à partir du titre
    function createSlug(title) {
      return title
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // Retire les accents
        .replace(/[^a-z0-9\s-]/g, '') // Garde seulement lettres, chiffres, espaces et tirets
        .trim()
        .replace(/\s+/g, '-'); // Remplace espaces par tirets
    }

    function playVideo(card, title) {
      // Stop toute autre vidéo en cours
      document.querySelectorAll('.video-card.playing, .music-card.playing').forEach(c => {
        if (c !== card) {
          stopVideo(c);
        }
      });

      const videoId = card.dataset.videoId;

      // Cache la carte originale MAIS garde la thumbnail visible pour éviter flash blanc au retour
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';

      const originalThumbnail = card.querySelector('.video-thumbnail, .music-thumbnail');
      if (originalThumbnail) {
        originalThumbnail.style.position = 'absolute';
        originalThumbnail.style.inset = '0';
        originalThumbnail.style.zIndex = '-1';
        originalThumbnail.style.opacity = '1';
        originalThumbnail.style.display = 'block';
      }

      // Clone la carte pour l'animation
      const clone = card.cloneNode(true);
      clone.classList.add('video-clone');
      const cloneIframe = clone.querySelector('iframe');

      // Position du clone = position actuelle de la carte
      const startRect = card.getBoundingClientRect();
      clone.style.position = 'fixed';
      clone.style.left = startRect.left + 'px';
      clone.style.top = startRect.top + 'px';
      clone.style.width = startRect.width + 'px';
      clone.style.height = startRect.height + 'px';
      clone.style.margin = '0';
      clone.style.transition = 'none';
      clone.style.opacity = '1';
      clone.style.pointerEvents = 'auto';

      document.body.appendChild(clone);
      card._clone = clone;

      // Calcule position finale adaptée au ratio de la vidéo
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      // Détecte le ratio (16:9 par défaut, peut être surchargé avec data-ratio)
      const videoRatio = card.dataset.ratio ? eval(card.dataset.ratio) : (16 / 9);

      // Calcule taille optimale selon le ratio de la vidéo
      let maxWidth = Math.min(viewportWidth * 0.85, 1200);
      let finalHeight = maxWidth / videoRatio;

      // Vérifie si ça dépasse la hauteur disponible
      if (finalHeight > viewportHeight * 0.85) {
        finalHeight = viewportHeight * 0.85;
        maxWidth = finalHeight * videoRatio;
      }

      const finalLeft = (viewportWidth - maxWidth) / 2;
      const finalTop = (viewportHeight - finalHeight) / 2;

      // Active l'état playing
      clone.classList.add('playing', 'loading');
      document.body.classList.add('video-playing');

      // Anime le clone vers la position finale
      requestAnimationFrame(() => {
        clone.style.transition = 'all 0.5s cubic-bezier(0.32, 0.72, 0, 1)';
        clone.style.left = finalLeft + 'px';
        clone.style.top = finalTop + 'px';
        clone.style.width = maxWidth + 'px';
        clone.style.height = finalHeight + 'px';

        // Lance la vidéo
        setTimeout(() => {
          // Cacher le loader dès le début (crossfade suffit)
          const loader = clone.querySelector('.video-loader');
          if (loader) {
            loader.style.display = 'none';
          }
          clone.classList.remove('loading');

          cloneIframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&quality=auto&muted=0&title=0&byline=0&portrait=0`;

          // Crossfade thumbnail → video (pas de loader)
          const cloneThumbnail = clone.querySelector('.video-thumbnail, .music-thumbnail');
          cloneIframe.style.opacity = '0';
          cloneIframe.style.transition = 'opacity 0.4s ease-out';

          cloneIframe.onload = () => {
            // Attendre un peu que Vimeo démarre
            setTimeout(() => {
              // Fade IN iframe
              cloneIframe.style.opacity = '1';

              // Fade OUT thumbnail simultanément
              if (cloneThumbnail) {
                cloneThumbnail.style.transition = 'opacity 0.4s ease-out';
                cloneThumbnail.style.opacity = '0';
              }

              // Marquer comme loaded après transition
              setTimeout(() => {
                clone.classList.add('loaded');
              }, 400);
            }, 100);
          };
        }, 300);

        // Bouton close sur le clone
        const closeBtn = clone.querySelector('.close-btn');
        if (closeBtn) {
          closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopVideo(card);
          });
        }
      });

      // Met à jour l'URL pour permettre le partage (format: #page/video-id)
      const currentPage = document.querySelector('nav a.active')?.dataset.page || 'film';
      window.location.hash = `${currentPage}/${videoId}`;
    }

    function stopVideo(card) {
      const clone = card._clone;
      if (!clone) return;

      // Nettoyer le highlight bleu (si navigation flèches avant fermeture)
      card.style.outline = '';
      card.style.outlineOffset = '';

      // IMPORTANT: Nettoyer tous les styles de swipe avant fermeture
      clone.style.transition = 'none';
      clone.style.transform = ''; // Reset transform si utilisé

      // Scroll vers la carte pour garantir qu'elle est visible (animation plus belle)
      card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });

      // Attendre que le scroll smooth se termine (100ms)
      setTimeout(() => {
        const targetRect = card.getBoundingClientRect();

        document.body.classList.remove('video-playing');
        clone.classList.remove('playing', 'loaded', 'loading');

        const cloneIframe = clone.querySelector('iframe');
        const cloneThumbnail = clone.querySelector('.video-thumbnail, .music-thumbnail');

        // Cache l'iframe immédiatement
        if (cloneIframe) {
          cloneIframe.style.transition = 'none';
          cloneIframe.style.opacity = '0';
          cloneIframe.style.visibility = 'hidden';
        }

        // Thumbnail du clone visible
        if (cloneThumbnail) {
          cloneThumbnail.style.transition = 'none';
          cloneThumbnail.style.position = 'absolute';
          cloneThumbnail.style.inset = '0';
          cloneThumbnail.style.opacity = '1';
          cloneThumbnail.style.display = 'block';
        }

        // IMPORTANT: Restaurer la miniature de la carte originale
        const cardThumbnail = card.querySelector('.video-thumbnail, .music-thumbnail');
        if (cardThumbnail) {
          cardThumbnail.style.opacity = '1';
          cardThumbnail.style.display = 'block';
        }

        // IMPORTANT: Rend la carte visible DÈS LE DÉBUT (en dessous du clone)
        card.style.transition = 'none';
        card.style.opacity = '1';
        card.style.pointerEvents = 'auto';

        clone.offsetHeight;

        // Cleanup + bounce à la fin de l'animation
        const onTransitionEnd = (e) => {
          if (e.target !== clone) return;

          clone.removeEventListener('transitionend', onTransitionEnd);

          // Petit bounce sur la carte pour effet fun et satisfaisant
          card.classList.add('returning');
          setTimeout(() => card.classList.remove('returning'), 300);

          // Remove clone après fade
          setTimeout(() => {
            if (clone.parentNode) {
              clone.parentNode.removeChild(clone);
            }
            card._clone = null;
          }, 100);
        };

        clone.addEventListener('transitionend', onTransitionEnd);

        // Animation style iPhone: rapide, fluide, bounce satisfaisant
        requestAnimationFrame(() => {
          // Dezoom avec bounce iOS (courbe spring)
          clone.style.transition = 'all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease-out 0.15s';
          clone.style.left = targetRect.left + 'px';
          clone.style.top = targetRect.top + 'px';
          clone.style.width = targetRect.width + 'px';
          clone.style.height = targetRect.height + 'px';
          clone.style.opacity = '0';
        });

        // Restaure le hash vers juste la page (enlève le /video-slug)
        const currentPage = document.querySelector('nav a.active')?.dataset.page || 'film';
        window.location.hash = currentPage;
      }, 100); // Attendre scroll smooth
    }

    // Escape pour fermer la vidéo ou revenir à la home
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        // Chercher le clone en cours de lecture
        const playingClone = document.querySelector('.video-clone.playing, .music-card.playing');
        if (playingClone) {
          // Trouver la carte originale associée au clone
          const currentPage = document.querySelector('nav a.active').dataset.page;
          const cards = Array.from(document.querySelectorAll(
            currentPage === 'music' ? '.music-card' : '.video-card'
          ));
          const originalCard = cards.find(c => c._clone === playingClone);

          if (originalCard) {
            // Fermer la vidéo avec animation
            stopVideo(originalCard);
          }
        } else {
          // Sinon, ramener à la page Film (home)
          const currentPage = document.querySelector('nav a.active').dataset.page;
          if (currentPage !== 'film') {
            navigateToPage('film');
          }
        }
      }

      // Navigation avec les flèches gauche/droite (transition smooth)
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const playingClone = document.querySelector('.video-clone.playing, .music-card.playing');
        if (!playingClone) return;

        e.preventDefault();

        const currentPage = document.querySelector('nav a.active').dataset.page;
        const cards = Array.from(document.querySelectorAll(
          currentPage === 'music' ? '.music-card' : '.video-card'
        ));

        // Trouve la carte originale associée au clone
        const originalCard = Array.from(cards).find(c => c._clone === playingClone);
        if (!originalCard) return;

        const currentIndex = cards.indexOf(originalCard);

        let nextIndex;
        if (e.key === 'ArrowLeft') {
          nextIndex = currentIndex > 0 ? currentIndex - 1 : cards.length - 1;
        } else {
          nextIndex = currentIndex < cards.length - 1 ? currentIndex + 1 : 0;
        }

        const nextCard = cards[nextIndex];
        if (nextCard && nextCard !== originalCard) {
          // Transition smooth : fade out iframe, change src, fade in
          const iframe = playingClone.querySelector('iframe');
          const thumbnail = playingClone.querySelector('.video-thumbnail, .music-thumbnail');

          // Swipe animation (slide out direction)
          const direction = e.key === 'ArrowLeft' ? 1 : -1; // Left = slide right, Right = slide left

          // Force thumbnail visible (enlève classe loaded qui la cache)
          // IMPORTANT: on ne rajoute JAMAIS 'loading' pendant le swipe (crossfade suffit)
          playingClone.classList.remove('loaded', 'loading');

          // Cacher le loader définitivement pendant le swipe
          const loader = playingClone.querySelector('.video-loader');
          if (loader) {
            loader.style.display = 'none';
          }

          // Garde thumbnail visible pendant swipe
          iframe.style.opacity = '0';
          if (thumbnail) {
            thumbnail.style.setProperty('opacity', '1', 'important');
            thumbnail.style.setProperty('display', 'block', 'important');
            thumbnail.style.position = 'absolute';
            thumbnail.style.inset = '0';
            thumbnail.style.zIndex = '10';
          }

          // CRITIQUE: Désactiver overflow-x hidden temporairement pour voir le swipe
          document.body.style.overflowX = 'visible';

          // Récupère position actuelle ET dimensions AVANT le swipe
          const currentLeft = parseFloat(playingClone.style.left);
          const currentWidth = playingClone.offsetWidth;
          const currentHeight = playingClone.offsetHeight;
          const viewportWidth = window.innerWidth;

          // Swipe OUT - Animer LEFT directement (rapide et fluide)
          playingClone.style.transition = 'left 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
          playingClone.style.left = `${currentLeft + (direction * viewportWidth)}px`; // Slide hors écran

          setTimeout(() => {
            // Change video
            const newVideoId = nextCard.dataset.videoId;
            iframe.src = `https://player.vimeo.com/video/${newVideoId}?autoplay=1&quality=auto&muted=0&title=0&byline=0&portrait=0`;

            // Update thumbnail
            if (thumbnail) {
              const newThumbnail = nextCard.querySelector('.video-thumbnail, .music-thumbnail');
              if (newThumbnail) {
                thumbnail.src = newThumbnail.src;
              }
            }

            // Restaurer la miniature ET la carte précédente
            const originalThumbnail = originalCard.querySelector('.video-thumbnail, .music-thumbnail');
            if (originalThumbnail) {
              originalThumbnail.style.opacity = '1';
              originalThumbnail.style.display = 'block';
            }
            // Restaurer l'opacité de la carte
            originalCard.style.opacity = '1';
            originalCard.style.pointerEvents = 'auto';

            // Update association
            originalCard._clone = null;
            nextCard._clone = playingClone;

            // Garde dimensions actuelles (pas de recalcul pour éviter letterbox)
            playingClone.style.width = currentWidth + 'px';
            playingClone.style.height = currentHeight + 'px';

            // Position clone hors écran côté opposé (instantané)
            playingClone.style.transition = 'none';
            playingClone.style.left = `${currentLeft + (direction * -viewportWidth)}px`; // Hors écran opposé
            playingClone.style.opacity = '1'; // Garde opacité pour éviter blanc

            // Force reflow
            playingClone.offsetHeight;

            // Swipe IN animation (entre par l'autre côté - rapide)
            requestAnimationFrame(() => {
              playingClone.style.transition = 'left 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
              playingClone.style.left = currentLeft + 'px'; // Retour à la position centrée d'origine
            });

            // Crossfade thumbnail → video quand iframe est loaded (pas de blanc)
            iframe.style.opacity = '0';
            iframe.style.transition = 'opacity 0.4s ease-out';

            iframe.onload = () => {
              // Attendre un peu que la vidéo commence à jouer
              setTimeout(() => {
                // Fade IN iframe
                iframe.style.opacity = '1';

                // Fade OUT thumbnail simultanément
                if (thumbnail) {
                  thumbnail.style.transition = 'opacity 0.4s ease-out';
                  thumbnail.style.opacity = '0';
                }

                // Marquer comme loaded après transition
                setTimeout(() => {
                  playingClone.classList.add('loaded');
                }, 400);
              }, 100);
            };

            // IMPORTANT: Réattacher le close button event listener après navigation
            const closeBtn = playingClone.querySelector('.close-btn');
            if (closeBtn) {
              // Supprimer ancien listener (si existe)
              const newCloseBtn = closeBtn.cloneNode(true);
              closeBtn.parentNode.replaceChild(newCloseBtn, closeBtn);

              // Réattacher le listener
              newCloseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                stopVideo(nextCard);
              });
            }

            // Update URL avec l'ID de la vidéo
            const videoData = currentPage === 'music' ? musicVideos : videos;
            const newVideo = videoData.find(v => v.id === newVideoId);
            if (newVideo) {
              window.location.hash = `${currentPage}/${newVideoId}`;

              // Afficher le titre en overlay
              showVideoTitle(newVideo.title);
            }

            // Scroll vers la carte active + highlight
            nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // Highlight temporaire
            nextCard.style.outline = '3px solid rgba(109, 181, 196, 0.8)';
            nextCard.style.outlineOffset = '4px';
            setTimeout(() => {
              nextCard.style.outline = '';
              nextCard.style.outlineOffset = '';
            }, 1500);

            // Fade in after load (crossfade rapide)
            iframe.onload = () => {
              setTimeout(() => {
                iframe.style.transition = 'opacity 0.4s ease';
                iframe.style.opacity = '1';
                if (thumbnail) {
                  thumbnail.style.transition = 'opacity 0.4s ease';
                  thumbnail.style.opacity = '0';
                }
              }, 100); // Crossfade rapide après chargement
            };

            // Remettre overflow-x hidden après swipe IN terminé (300ms + 100ms marge)
            setTimeout(() => {
              document.body.style.overflowX = 'hidden';
            }, 400);
          }, 100); // Délai court pour transition fluide (swipe OUT se termine à 300ms)
        }
      }
    });

    // Auto-play vidéo si hash présent dans l'URL au chargement
    window.addEventListener('load', () => {
      const hash = window.location.hash.slice(1); // Retire le #
      if (hash && hash.includes('/')) {
        // Format: "film/video-id" ou "music/video-id"
        const [page, videoId] = hash.split('/');

        // Cherche la vidéo correspondant à l'ID
        const allVideos = [...videos, ...musicVideos];
        const matchedVideo = allVideos.find(v => v.id === videoId);

        if (matchedVideo) {
          // Trouve la carte correspondante
          const card = document.querySelector(`[data-video-id="${matchedVideo.id}"]`);
          if (card) {
            // Si c'est une vidéo music, switch vers la page music d'abord
            if (musicVideos.some(v => v.id === matchedVideo.id)) {
              const musicLink = document.querySelector('nav a[data-page="music"]');
              if (musicLink) musicLink.click();
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            } else {
              // C'est une vidéo film, joue direct
              setTimeout(() => {
                playVideo(card, matchedVideo.title);
              }, 300);
            }
          }
        }
      }
    });
  </script>
</body>
