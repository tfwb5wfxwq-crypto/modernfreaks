<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks - Horizontal Scroll</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --black: #2D3853;
      --white: #fafafa;
      --red: #E3232C;
      --gray: #898F9F;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: var(--black);
      color: var(--white);
      overflow: hidden;
      cursor: grab;
    }

    body.grabbing {
      cursor: grabbing;
    }

    /* Header fixe */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 40px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(45,56,83,0.95) 0%, transparent 100%);
      backdrop-filter: blur(20px);
    }

    .logo {
      font-family: 'Europa', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 1px;
      color: var(--white);
      cursor: pointer;
      position: relative;
      transition: all 0.4s ease;
    }

    .logo::before {
      content: 'modern freaks';
      position: absolute;
      top: 0;
      left: 0;
      color: var(--red);
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
      transition: clip-path 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo:hover::before {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    nav {
      display: flex;
      gap: 40px;
    }

    nav a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--red);
      transition: width 0.3s ease;
    }

    nav a:hover,
    nav a.active {
      color: white;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    /* Scroll hint */
    .scroll-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: pulse 2s ease-in-out infinite;
    }

    .scroll-hint::before,
    .scroll-hint::after {
      content: '';
      width: 40px;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Container horizontal */
    .horizontal-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 0 60px;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Video Cards */
    .video-card {
      position: relative;
      height: 70vh;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .video-card:hover {
      transform: scale(1.05) translateY(-10px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 2px rgba(227, 35, 44, 0.3);
      z-index: 100;
    }

    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(45,56,83,0.9) 0%, transparent 50%);
      opacity: 0.6;
      transition: opacity 0.4s ease;
      z-index: 1;
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.6s ease;
    }

    .video-card:hover .video-thumbnail {
      transform: scale(1.1);
    }

    /* Play Button */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.8;
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 28px solid white;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      margin-left: 6px;
    }

    .video-card:hover .play-btn {
      transform: translate(-50%, -50%) scale(1.15);
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 20px 60px rgba(227, 35, 44, 0.6);
      opacity: 1;
    }

    /* Video Info */
    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 32px;
      z-index: 2;
      transform: translateY(15px);
      opacity: 0;
      transition: all 0.4s ease;
    }

    .video-card:hover .video-info {
      transform: translateY(0);
      opacity: 1;
    }

    .video-title {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      line-height: 1.3;
    }

    .video-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1px;
    }

    /* Progress bar */
    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--red);
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    /* Fullscreen Player */
    .fullscreen-player {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-player.active {
      display: flex;
    }

    .fullscreen-player iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fullscreen-close {
      position: absolute;
      top: 40px;
      right: 40px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10000;
    }

    .fullscreen-close:hover {
      background: white;
      color: var(--black);
      transform: scale(1.1) rotate(90deg);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
      }

      .logo {
        font-size: 32px;
      }

      nav {
        gap: 20px;
      }

      .horizontal-container {
        padding: 0 20px;
        gap: 20px;
      }

      .video-card {
        height: 60vh;
      }

      .scroll-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

      { id: "277879120", title: "Advertising OST for Moulinex World - Jam Block_qtp" }
    ];

    const container = document.getElementById('horizontalContainer');
    const progressBar = document.getElementById('progressBar');
    const fullscreenPlayer = document.getElementById('fullscreenPlayer');
    const videoPlayer = document.getElementById('videoPlayer');

    let currentX = 0;
    let targetX = 0;
    let isDragging = false;
    let startX = 0;
    let scrollLeft = 0;

    // Générer les cards
    videos.forEach((video) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <img class="video-thumbnail" src="images/${video.id}.jpg" alt="${video.title}">
        <div class="play-btn"></div>
        <div class="video-info">
          <div class="video-title">${video.title}</div>
          <div class="video-meta">Vimeo · ${video.id}</div>
        </div>
      `;

      card.addEventListener('click', () => {
        if (!isDragging) {
          openFullscreen(video.id);
        }
      });

      container.appendChild(card);
    });

    // Scroll avec molette (vertical → horizontal)
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetX -= e.deltaY * 2;
      const maxScroll = -(container.scrollWidth - window.innerWidth);
      targetX = Math.max(maxScroll, Math.min(0, targetX));
    }, { passive: false });

    // Drag avec souris
    container.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.pageX;
      scrollLeft = targetX;
      document.body.classList.add('grabbing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const x = e.pageX;
      const walk = (x - startX) * 2;
      targetX = scrollLeft + walk;
      const maxScroll = -(container.scrollWidth - window.innerWidth);
      targetX = Math.max(maxScroll, Math.min(0, targetX));
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      document.body.classList.remove('grabbing');
    });

    // Touch pour mobile
    let touchStart = 0;
    container.addEventListener('touchstart', (e) => {
      touchStart = e.touches[0].clientX;
      scrollLeft = targetX;
    });

    container.addEventListener('touchmove', (e) => {
      const touchX = e.touches[0].clientX;
      const walk = (touchX - touchStart) * 2;
      targetX = scrollLeft + walk;
      const maxScroll = -(container.scrollWidth - window.innerWidth);
      targetX = Math.max(maxScroll, Math.min(0, targetX));
    });

    // Animation loop avec inertie
    function animate() {
      currentX += (targetX - currentX) * 0.1; // Inertie fluide
      container.style.transform = `translateX(${currentX}px)`;

      // Progress bar
      const maxScroll = container.scrollWidth - window.innerWidth;
      const progress = Math.abs(currentX) / maxScroll * 100;
      progressBar.style.width = `${progress}%`;

      requestAnimationFrame(animate);
    }
    animate();

    function openFullscreen(videoId) {
      videoPlayer.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&quality=1080p`;
      fullscreenPlayer.classList.add('active');
      document.body.style.overflow = 'hidden';

      if (fullscreenPlayer.requestFullscreen) {
        fullscreenPlayer.requestFullscreen().catch(() => {});
      } else if (fullscreenPlayer.webkitRequestFullscreen) {
        fullscreenPlayer.webkitRequestFullscreen();
      }
    }

    function closeFullscreen() {
      videoPlayer.src = '';
      fullscreenPlayer.classList.remove('active');
      document.body.style.overflow = '';

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFullscreen();
      if (e.key === 'ArrowRight') targetX -= 300;
      if (e.key === 'ArrowLeft') targetX += 300;
    });

    fullscreenPlayer.addEventListener('click', (e) => {
      if (e.target === fullscreenPlayer) closeFullscreen();
    });
  </script>
