<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Freaks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #2D3853;
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 35px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Logo multicolore simple */
    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      display: flex;
      gap: 2px;
    }

    .logo span {
      transition: all 0.3s ease;
    }

    .logo span:hover {
      transform: translateY(-4px);
    }

    .logo .f { color: #6DB5C4; }
    .logo .r { color: #2D3853; }
    .logo .e { color: #E3232C; }
    .logo .a { color: #2D3853; }
    .logo .k { color: #6DB5C4; }
    .logo .s { color: #E3232C; }

    .logo-sub {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #898F9F;
      font-weight: 400;
      margin-left: 12px;
      align-self: flex-end;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      color: #898F9F;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1px;
      background: #E3232C;
      transition: width 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #2D3853;
    }

    nav a:hover::after,
    nav a.active::after {
      width: 100%;
    }

    /* Main */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 150px 50px 100px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #898F9F;
      margin-bottom: 50px;
      font-weight: 500;
    }

    /* Masonry Grid fluide */
    .masonry-grid {
      column-count: 3;
      column-gap: 25px;
    }

    .video-card {
      position: relative;
      break-inside: avoid;
      margin-bottom: 25px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #f8f8f8;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(20px);
    }

    .video-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .video-card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.08),
        0 0 0 1px rgba(227, 35, 44, 0.08);
    }

    .video-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(45,56,83,0.85) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .video-card:hover::before {
      opacity: 1;
    }

    .video-thumbnail {
      width: 100%;
      display: block;
      transition: transform 0.5s ease;
    }

    .video-card:hover .video-thumbnail {
      transform: scale(1.05);
    }

    /* Play Button minimal */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .video-card:hover .play-btn {
      opacity: 1;
    }

    .play-btn::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 16px solid #2D3853;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      margin-left: 4px;
    }

    /* Info minimal */
    .video-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      z-index: 2;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .video-card:hover .video-info {
      opacity: 1;
      transform: translateY(0);
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      color: white;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .video-meta {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
    }

    /* Fullscreen */
    .fullscreen-player {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45, 56, 83, 0.98);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .fullscreen-player.active {
      display: flex;
    }

    .fullscreen-player iframe {
      width: 90%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 8px;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.4);
    }

    .fullscreen-close {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      z-index: 10000;
    }

    .fullscreen-close:hover {
      background: white;
      color: #2D3853;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .masonry-grid {
        column-count: 2;
      }
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        gap: 20px;
        padding: 25px 30px;
      }

      .logo {
        font-size: 38px;
      }

      nav {
        gap: 25px;
      }

      main {
        padding: 130px 30px 80px;
      }

      .masonry-grid {
        column-count: 1;
      }
    }
  </style>
</head>
